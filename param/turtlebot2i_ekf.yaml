ekf_filter_node:
  frequency: 50
  sensor_timeout: 0.1
  two_d_mode: true

  # Frames
  map_frame: map
  odom_frame: odom
  base_link_frame: base_footprint
  world_frame: odom
  # change to false to don't use IMU
  publish_tf: true

  # Wheel odometry — só posição X, Y e velocidade linear X
  odom0: /odom_raw
  odom0_config: [false,  false,  false,
                 false, false, false,
                 true,  false, false,
                 false, false, true,
                 false, false, false]
  odom0_queue_size: 10
  odom0_differential: false
  odom0_relative: false

  # IMU — só yaw e velocidade angular Z
  imu0: /imu/data_raw
  imu0_config: [false, false, false,
                false, false, true,
                false, false, false,
                false, false, true,
                false, false, false]
  imu0_queue_size: 10
  imu0_differential: false
  imu0_relative: true
  imu0_remove_gravitational_acceleration: true

  use_control: false